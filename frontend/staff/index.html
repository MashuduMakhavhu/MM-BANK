<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1120">
    <title>M&M Bank | Staff Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-view" class="login-view">
        <div class="login-card">
            <div class="brand">
                <span class="brand-mark">M</span>
                <div>
                    <h1>M&M Bank</h1>
                    <p>STAFF PORTAL</p>
                </div>
            </div>

            <h2>Welcome back</h2>
            <p class="muted">Sign in to access the management system.</p>

            <form id="login-form">
                <label for="staff-number">Staff number</label>
                <input id="staff-number" type="text"
                    autocomplete="username" required>

                <label for="staff-password">Password</label>
                <input id="staff-password" type="password"
                    autocomplete="current-password" required>

                <p id="login-error" class="error" role="alert"></p>
                <button type="submit" id="login-button">Sign in</button>
            </form>

            <p class="login-footer">Secure staff access · Mash Co.</p>
        </div>
    </div>

    <div id="app-view" class="app-view hidden">
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-mark">M</span>
                <div>
                    <h1>M&M Bank</h1>
                    <p>MANAGEMENT</p>
                </div>
            </div>

            <nav id="sidebar-nav">
                <button class="nav-link active" data-page="dashboard">Overview</button>
                <button class="nav-link" data-page="customers">Customers</button>
                <button class="nav-link" data-page="accounts">Accounts</button>
                <button class="nav-link" data-page="cards">ATM Cards</button>
            </nav>

            <div class="sidebar-bottom">
                <p id="staff-identity">Staff member</p>
                <button id="logout-button" class="logout-button">Sign out</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div>
                    <p class="muted">M&M BANK / MANAGEMENT</p>
                    <h2 id="page-title">Overview</h2>
                </div>
                <span id="staff-role" class="role-label">STAFF</span>
            </header>

            <section id="page-content"></section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
