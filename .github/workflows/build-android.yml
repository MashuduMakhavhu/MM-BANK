name: Build M&M Bank Android APK

on:
  push:
    branches: [main]
    tags:
      - 'mobile-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json

      - name: Install dependencies
        working-directory: frontend/mobile
        run: npm ci

      - name: Sync Capacitor Android
        working-directory: frontend/mobile
        run: npx cap sync android

      - name: Build APK
        working-directory: frontend/mobile
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MM-Bank-Android-APK
          path: frontend/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: frontend/mobile/android/app/build/outputs/apk/debug/app-debug.apk
